name: Create Release Archive

on:
  release:
    types: [published]

jobs:
  create-archive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Create archive with correct directory structure
      run: |
        # Create a temporary directory outside current directory
        mkdir -p ../temp_archive/skysplat_blender
        
        # Copy all files except .git, images directory, and temp directories
        find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name 'images' -not -name '../temp_archive' -exec cp -r {} ../temp_archive/skysplat_blender/ \;
        
        # Move the directory structure to workspace for processing
        mv skysplat_blender $GITHUB_WORKSPACE/
        cd $GITHUB_WORKSPACE
        
        # Verify the directory structure
        echo "Checking directory structure:"
        find skysplat_blender -type f | head -20
        
        # Check directory size
        du -sh skysplat_blender/
        
        # Create the zip file for release
        zip -r skysplat_blender.zip skysplat_blender/
        echo "Zip file size:"
        ls -lh skysplat_blender.zip
        
        # Clean up temporary directory
        rm -rf ../temp_archive
    
    - name: Upload archive to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./skysplat_blender.zip
        asset_name: skysplat_blender.zip
        asset_content_type: application/zip