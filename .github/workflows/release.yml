name: Create Release Archive

on:
  release:
    types: [published]

jobs:
  create-archive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Create archive with correct directory structure
      run: |
        # Create the target directory structure in workspace
        mkdir -p skysplat_blender
        
        # Copy all files except .git directory
        for item in *; do
          if [[ "$item" != ".git" && "$item" != "skysplat_blender" ]]; then
            cp -r "$item" skysplat_blender/
          fi
        done
        
        # Copy hidden files except .git
        for item in .*; do
          if [[ "$item" != "." && "$item" != ".." && "$item" != ".git" ]]; then
            cp -r "$item" skysplat_blender/
          fi
        done
        
        # Create the zip file
        zip -r skysplat_blender.zip skysplat_blender/
        
        # Verify the zip structure
        echo "Checking zip file contents:"
        unzip -l skysplat_blender.zip | head -20
        echo "Zip file size:"
        ls -lh skysplat_blender.zip
    
    - name: Upload archive to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./skysplat_blender.zip
        asset_name: skysplat_blender.zip
        asset_content_type: application/zip