name: Create Release Archive

on:
  release:
    types: [published]

jobs:
  create-archive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Create archive with correct directory structure
      run: |
        # Create a temporary directory outside current directory
        mkdir -p ../temp_archive/skysplat_blender
        
        # Copy all files except .git, images directory, and temp directories
        find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name 'images' -exec cp -r {} ../temp_archive/skysplat_blender/ \;
        
        # Debug: Check what was created
        echo "Contents of temp_archive:"
        ls -la ../temp_archive/
        echo "Contents of skysplat_blender directory:"
        ls -la ../temp_archive/skysplat_blender/
        
        # Create the zip file directly from temp_archive
        cd ../temp_archive
        zip -r skysplat_blender.zip skysplat_blender/
        mv skysplat_blender.zip $GITHUB_WORKSPACE/
        cd $GITHUB_WORKSPACE
        
        # Verify the zip structure
        echo "Checking zip file contents:"
        unzip -l skysplat_blender.zip | head -20
        echo "Zip file size:"
        ls -lh skysplat_blender.zip
        
        # Clean up temporary directory
        rm -rf ../temp_archive
    
    - name: Upload archive to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./skysplat_blender.zip
        asset_name: skysplat_blender.zip
        asset_content_type: application/zip