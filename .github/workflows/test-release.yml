name: Test Release Archive Creation

on:
  workflow_dispatch:  # Allows manual triggering from GitHub Actions tab
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/test-release.yml' ]  # Only run when this file changes

jobs:
  test-archive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Create directory structure for archive
      run: |
        # Create the target directory structure in workspace
        mkdir -p skysplat_blender
        
        # Copy all files except .git and images directory
        for item in *; do
          if [[ "$item" != ".git" && "$item" != "images" && "$item" != "skysplat_blender" ]]; then
            cp -r "$item" skysplat_blender/
          fi
        done
        
        # Copy hidden files except .git
        for item in .*; do
          if [[ "$item" != "." && "$item" != ".." && "$item" != ".git" ]]; then
            cp -r "$item" skysplat_blender/
          fi
        done
        
        # Verify the directory contents
        echo "Checking directory structure:"
        ls -la skysplat_blender/
        echo "Directory size:"
        du -sh skysplat_blender/
    
    - name: Upload test archive as artifact
      uses: actions/upload-artifact@v4
      with:
        name: skysplat_blender
        path: skysplat_blender/
        retention-days: 7