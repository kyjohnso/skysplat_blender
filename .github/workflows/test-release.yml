name: Test Release Archive Creation

on:
  workflow_dispatch:  # Allows manual triggering from GitHub Actions tab
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/test-release.yml' ]  # Only run when this file changes

jobs:
  test-archive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Create archive with correct directory structure
      run: |
        # Copy all files except .git, images directory, and temp directories
        find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name 'images' -exec cp -r {} ../temp_archive/skysplat_blender/ \;
        
        # Debug: Check what was created
        echo "Contents of temp_archive:"
        ls -la ../temp_archive/
        echo "Contents of skysplat_blender directory:"
        ls -la ../temp_archive/skysplat_blender/
        
        # Move the skysplat_blender directory to workspace so it can be uploaded
        cd ../temp_archive
        mv skysplat_blender $GITHUB_WORKSPACE/
        cd $GITHUB_WORKSPACE
        
        # Verify the directory structure
        echo "Final directory structure:"
        ls -la skysplat_blender/
        
        # Clean up temporary directory
        rm -rf ../temp_archive
    
    - name: Upload test archive as artifact
      uses: actions/upload-artifact@v4
      with:
        name: skysplat_blender-test-archive
        path: skysplat_blender
        retention-days: 7