name: Test Release Archive Creation

on:
  workflow_dispatch:  # Allows manual triggering from GitHub Actions tab
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/test-release.yml' ]  # Only run when this file changes

jobs:
  test-archive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Create archive with correct directory structure
      run: |
        # Create the target directory structure in workspace
        mkdir -p skysplat_blender
        
        # Copy all files except .git directory
        for item in *; do
          if [[ "$item" != ".git" && "$item" != "skysplat_blender" ]]; then
            cp -r "$item" skysplat_blender/
          fi
        done
        
        # Copy hidden files except .git
        for item in .*; do
          if [[ "$item" != "." && "$item" != ".." && "$item" != ".git" ]]; then
            cp -r "$item" skysplat_blender/
          fi
        done
        
        # Create the zip file
        zip -r skysplat_blender.zip skysplat_blender/
        
        # Verify the zip structure
        echo "Checking zip file contents:"
        unzip -l skysplat_blender.zip | head -20
        echo "Zip file size:"
        ls -lh skysplat_blender.zip
    
    - name: Upload test archive as artifact
      uses: actions/upload-artifact@v4
      with:
        name: skysplat_blender-test-archive
        path: skysplat_blender.zip
        retention-days: 7