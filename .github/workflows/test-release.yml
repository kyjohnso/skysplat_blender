name: Test Release Archive Creation

on:
  workflow_dispatch:  # Allows manual triggering from GitHub Actions tab
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/test-release.yml' ]  # Only run when this file changes

jobs:
  test-archive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Create archive with correct directory structure
      run: |
        # Create a temporary directory outside current directory
        mkdir -p ../temp_archive/skysplat_blender
        
        # Copy all files except .git, images directory, and temp directories
        find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name 'images' -not -name '../temp_archive' -exec cp -r {} ../temp_archive/skysplat_blender/ \;
        
        # Move the directory structure to workspace for artifact upload
        mv skysplat_blender $GITHUB_WORKSPACE/
        cd $GITHUB_WORKSPACE
        
        # Verify the directory structure
        echo "Checking directory structure:"
        find skysplat_blender -type f | head -20
        
        # Check directory size
        du -sh skysplat_blender/
        
        # Also create a zip for size comparison
        zip -r skysplat_blender-test.zip skysplat_blender/
        echo "Zip file size:"
        ls -lh skysplat_blender-test.zip
        
        # Clean up temporary directory
        rm -rf ../temp_archive
    
    - name: Upload test archive as artifact
      uses: actions/upload-artifact@v4
      with:
        name: skysplat_blender-test-archive
        path: skysplat_blender/
        retention-days: 7